<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Rusted Recall{% endblock %}</title>
  <style>
    :root {
      --bg: #14100d; --panel: #1e1813; --panel2: #271f18; --line: #3a2e23;
      --text: #ece3d8; --muted: #a5937f; --rust: #b5561f; --rust2: #d9772e;
      --green: #3f9d57; --amber: #d9a531; --red: #cf4c3a; --blue: #4a86c7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    a { color: var(--rust2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: linear-gradient(180deg,#241c15,#191410); border-bottom: 1px solid var(--line);
      padding: 12px 22px; display: flex; align-items: center; gap: 22px; position: sticky; top: 0; z-index: 10; }
    header .brand { font-weight: 700; letter-spacing: .5px; font-size: 18px; color: var(--rust2); }
    header nav { display: flex; gap: 16px; flex-wrap: wrap; }
    header nav a { color: var(--muted); font-size: 14px; }
    header nav a:hover { color: var(--text); }
    main { max-width: 1140px; margin: 0 auto; padding: 24px 22px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 26px 0 10px; color: var(--rust2); }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .grid { display: grid; gap: 14px; }
    .cards { grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .stat { font-size: 30px; font-weight: 700; color: var(--rust2); }
    .stat + .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
    th { color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .5px; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .directly_affected, .failed { background: rgba(207,76,58,.18); color: #f0917f; }
    .probably_affected, .repairing, .running, .queued { background: rgba(217,165,49,.18); color: #e7c069; }
    .needs_review, .requires_review, .ready_for_review, .partially_completed { background: rgba(74,134,199,.18); color: #85b6e6; }
    .safe, .completed, .approved { background: rgba(63,157,87,.18); color: #7fce97; }
    .draft, .analysing { background: rgba(165,147,127,.16); color: var(--muted); }
    .btn { display: inline-block; background: var(--rust); color: #fff; border: none; border-radius: 8px;
      padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--rust2); text-decoration: none; }
    .btn.secondary { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
    .banner { border-radius: 10px; padding: 12px 16px; margin: 0 0 18px; font-size: 14px; border: 1px solid; }
    .banner.warn { background: rgba(217,165,49,.10); border-color: #6b5620; color: #e7c069; }
    .banner.ok { background: rgba(63,157,87,.10); border-color: #2f5c3c; color: #7fce97; }
    .banner.err { background: rgba(207,76,58,.10); border-color: #6b2b22; color: #f0917f; }
    label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
    input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line);
      color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 14px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #0d0a08; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
    .muted { color: var(--muted); }
    ul.reasons { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">RUSTED RECALL</span>
    <nav>
      <a href="/">Command Center</a>
      <a href="/sources">Source of Truth</a>
      <a href="/assets">Asset Registry</a>
      <a href="/recalls/new">Create Recall</a>
      <a href="/diagnostics">Diagnostics</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
