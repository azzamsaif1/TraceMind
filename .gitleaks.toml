# Gitleaks configuration for Rusted Recall.
#
# Extends the upstream default ruleset (do not weaken it). The allowlist below
# ONLY suppresses findings from three historical commits that leaked B2 / GMI
# Cloud credentials. Those credentials are treated as compromised and MUST be
# rotated/revoked by the repository owner (an action Devin cannot perform); the
# git history itself can only be scrubbed with an owner-authorised force-push.
# The allowlist documents the known-bad commits so new leaks still fail CI.
[extend]
useDefault = true

[allowlist]
description = "Known historical credential leaks pending owner rotation + history scrub"
commits = [
  "001130e",
  "ba6e9f8",
  "2aed6b3",
]
